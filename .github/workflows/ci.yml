name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type Check & Build (web + api)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall builds @harlowe/shared so both apps can import it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client must be generated from the schema before the API type-checks.
      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      # Builds run tsc internally, so this covers type-checking too.
      # Web builds with the bundled JSON data source — no DB/API needed in CI.
      - name: Build web
        run: pnpm --filter web build

      - name: Build api
        run: pnpm --filter api build
